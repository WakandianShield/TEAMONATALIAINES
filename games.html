<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juegos UwU</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="games.css">
  <link rel="icon" href="rose.png" type="image/png">
</head>

<body>
  <nav class="navbar">
    <img src="rose.png" alt="Rosa" class="navbar-logo">
    <h1 class="navbar-title">Hola NatInes UwU</h1>
    <ul class="navbar-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="card.html">Carta</a></li>
      <li><a href="games.html">Juegos</a></li>
    </ul>
  </nav>

  <main class="page-content">

    <!-- Game Shelf -->
    <aside class="seccion-estante">
      <div class="estante" id="estanteJuegos" role="list" aria-label="Colección de juegos"></div>
    </aside>

    <!-- Nintendo Switch -->
    <div class="switch-area">
      <div class="switch-console">

        <!-- Left Joy-Con -->
        <div class="joycon joycon-izq">
          <div class="jc-analog jc-analog-top"></div>
          <button class="jc-sm-btn btn-minus" title="Minus">−</button>
          <button class="jc-sm-btn btn-capture" title="Captura">■</button>
          <div class="dpad">
            <button class="dpad-btn dpad-up" aria-label="Arriba">▲</button>
            <div class="dpad-mid">
              <button class="dpad-btn dpad-left" aria-label="Izquierda">◀</button>
              <div class="dpad-center"></div>
              <button class="dpad-btn dpad-right" aria-label="Derecha">▶</button>
            </div>
            <button class="dpad-btn dpad-down" aria-label="Abajo">▼</button>
          </div>
          <div class="jc-rail-strip jc-strip-right"></div>
        </div>

        <!-- Center Screen -->
        <div class="switch-center">
          <div class="switch-screen-bezel">
            <div class="switch-screen" id="switchScreen">
              <div class="screen-idle">
                <div class="idle-icon">🎮</div>
                <p class="idle-text">Elige un juego</p>
              </div>
            </div>
          </div>
          <div class="switch-bottom-bar">
            <div class="sw-vents">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
            <span class="sw-brand">NatSwitch</span>
            <div class="sw-vents">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
        </div>

        <!-- Right Joy-Con -->
        <div class="joycon joycon-der">
          <button class="jc-sm-btn btn-plus" title="Plus">+</button>
          <button class="jc-sm-btn btn-home" title="Home">⌂</button>
          <div class="abxy">
            <button class="abxy-btn btn-x">X</button>
            <div class="abxy-mid">
              <button class="abxy-btn btn-y">Y</button>
              <div class="abxy-center"></div>
              <button class="abxy-btn btn-a">A</button>
            </div>
            <button class="abxy-btn btn-b">B</button>
          </div>
          <div class="jc-analog jc-analog-bot"></div>
          <div class="jc-rail-strip jc-strip-left"></div>
        </div>

      </div>
    </div>
  </main>

  <div class="flowers-layer">
    <img src="rose.png" class="flower flower-7" alt="rosa">
    <img src="flowers.png" class="flower flower-8" alt="flores">
    <img src="flower.png" class="flower flower-9" alt="flor">
    <img src="flowers-2.png" class="flower flower-10" alt="flor">
    <img src="rose.png" class="flower flower-11" alt="rosa">
    <img src="flowers.png" class="flower flower-12" alt="flores">
    <img src="flower.png" class="flower flower-13" alt="flor">
    <img src="flowers-2.png" class="flower flower-14" alt="flor">
    <img src="rose.png" class="flower flower-15" alt="rosa">
    <img src="flowers.png" class="flower flower-16" alt="flores">
    <img src="flower.png" class="flower flower-17" alt="flor">
    <img src="flowers-2.png" class="flower flower-18" alt="flor">
    <img src="rose.png" class="flower flower-19" alt="rosa">
    <img src="flowers.png" class="flower flower-20" alt="flores">
  </div>

  <script src="games.js"></script>
</body>

</html>
