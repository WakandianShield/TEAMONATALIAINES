<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola UwU</title>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="card.css">
  <link rel="icon" href="rose.png" type="image/png">
</head>

<body>
  <nav class="navbar">
    <img src="rose.png" alt="Rosa" class="navbar-logo">
    <h1 class="navbar-title">Hola NatInes UwU</h1>
    <ul class="navbar-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="card.html">Carta</a></li>
      <li><a href="games.html">Juegos</a></li>
    </ul>
  </nav>

  <main class="page-content">
    <div class="seccion-estante">
      <div class="estante" id="estanteAlbum" role="list" aria-label="Colección de álbumes"></div>
    </div>

    <div class="escritorio">
      <div class="ipod-container">
        <div class="ipod">
          <div class="ipod-screen">
            <div class="screen-header">
              <span class="play-state">▶</span>
              <span class="menu-title">Ahora suena</span>
              <span class="battery">🔋</span>
            </div>

            <div class="now-playing-ipod">
              <div class="ipod-album-art">
                <img id="imgVinilo" src="placeholder.jpg" alt="Portada del álbum">
              </div>
              <div class="ipod-info">
                <h2 id="tituloActual" class="ipod-title">Elige un álbum</h2>
                <p id="artistaActual" class="ipod-artist"></p>
              </div>
            </div>

            <div class="ipod-progress-section">
              <div class="fondo-progreso" id="fondoProgreso">
                <div class="relleno-progreso" id="rellenoProgreso"></div>
              </div>
              <div class="tiempos-progreso">
                <span id="tiempoTranscurrido">0:00</span>
                <span id="duracionTiempo">0:00</span>
              </div>
            </div>

            <ul class="ipod-tracklist" id="listaPistas"></ul>
          </div>

          <div class="click-wheel">
            <button class="wheel-btn menu-btn">MENU</button>
            <button class="wheel-btn prev-btn">⏮</button>
            <button class="wheel-btn next-btn">⏭</button>
            <button class="wheel-btn play-pause-btn" id="btnReproducir">▶||</button>
            <div class="center-btn" id="btnDetener"></div>
          </div>
        </div>

        <div class="ipod-volume-container">
          <input type="range" class="deslizador-volumen" id="deslizadorVolumen" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>

      <div class="carta-contenedor">
        <div class="hoja-papel">
          <div class="odin-sticker">
            <span class="tu-texto">tu</span>
            <img src="odin.webp" alt="Odin" class="odin-img">
          </div>
          <textarea class="texto-carta" placeholder="Escribe aquí...">Hola Natines, quiero decirte que te agradezco por ser una gran persona, te agradezco por todas las enseñanzas que me das dia con dia, estoy muy agradecido de haberte conocido ya que eres una gran persona la cual tiene muchisimas cualidades y es por eso que siempre estare agradecido con la vida, Dios o el universo de haberte puesto en mi camino, te amo infinitamente, disculpame por todas las veces que te he hecho enojar o que hago mensadas, trato de mejorar pero por favor en ves de ignorarme para demostrarme tu enojo hazmelo saber y hay que tener buena comunicación plis, porque estoy muy tonto a veces y pues lo que menos quiero es estar mal contigo, te amo muchisisisisisimo Natines perdon si te harto por decirlo tanto pero real te amo mucho jejeje, ya te quiero ver, te extraño mucho tilina unu.</textarea>
        </div>
      </div>
    </div>

    <div class="flowers-layer">
      <img src="rose.png" class="flower flower-7" alt="rosa">
      <img src="flowers.png" class="flower flower-8" alt="flores">
      <img src="flower.png" class="flower flower-9" alt="flor">
      <img src="flowers-2.png" class="flower flower-10" alt="flor">
      <img src="rose.png" class="flower flower-11" alt="rosa">
      <img src="flowers.png" class="flower flower-12" alt="flores">
      <img src="flower.png" class="flower flower-13" alt="flor">
      <img src="flowers-2.png" class="flower flower-14" alt="flor">
      <img src="rose.png" class="flower flower-15" alt="rosa">
      <img src="flowers.png" class="flower flower-16" alt="flores">
      <img src="flower.png" class="flower flower-17" alt="flor">
      <img src="flowers-2.png" class="flower flower-18" alt="flor">
      <img src="rose.png" class="flower flower-19" alt="rosa">
      <img src="flowers.png" class="flower flower-20" alt="flores">
      <img src="flower.png" class="flower flower-21" alt="flor">
      <img src="flowers-2.png" class="flower flower-22" alt="flor">
      <img src="rose.png" class="flower flower-23" alt="rosa">
      <img src="flowers.png" class="flower flower-24" alt="flores">
      <img src="flower.png" class="flower flower-25" alt="flor">
      <img src="flowers-2.png" class="flower flower-26" alt="flor">
      <img src="rose.png" class="flower flower-27" alt="rosa">
      <img src="flowers.png" class="flower flower-28" alt="flores">
      <img src="flower.png" class="flower flower-29" alt="flor">
      <img src="flowers-2.png" class="flower flower-30" alt="flor">
      <img src="rose.png" class="flower flower-31" alt="rosa">
      <img src="flowers.png" class="flower flower-32" alt="flores">
    </div>
  </main>

  <audio id="reproductorAudio" preload="auto"></audio>

  <script src="script.js"></script>
</body>

</html>
